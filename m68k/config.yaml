limit: 2000
memory_size: 0x1000

memory_mapped_io:
  0x80: [49, 32, 50, 32, 51, 32, 52, 32, 43, 32, 42, 32, 47, 10]
  0x84: []

reports:
  - name: Execution trace
    slice: [tail, 30]
    view: |
      PC: {pc:hex} {pc:label}
      instruction: {instruction:next}
      input: {io:0x80:dec}
      output: {io:0x84:dec}

  - name: Check result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [0]
